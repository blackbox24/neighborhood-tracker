<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighborhood Delivery Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <h1>📍 Local Delivery Tracker</h1>
        <div id="connection-status" class="online">Connected Online</div>
        <div>
            <button onclick="googleSomething()">Click me</button>
        </div>
    </header>

    <main>
        <section class="delivery-section">
            <h2>Current Deliveries</h2>
            <ul id="delivery-list">
                <li>📦 <strong>Order #101:</strong> Milk & Bread — <span class="status pending">Pending</span></li>
                <li>📦 <strong>Order #102:</strong> First Aid Kit — <span class="status transit">In Transit</span></li>
            </ul>
        </section>
    </main>

    <script src="app.js"></script>
    <script type="text/javascript">
        function googleSomething(){
            fetch("https://google.com").catch(e => console.log(e));
        }
    </script>
</body>
</html>
